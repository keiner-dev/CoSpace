name: Deploy CoSpace to Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "set -e &&
               echo '→ Entrando al proyecto...' &&
               cd $SSH_PATH &&
               echo '→ Obteniendo últimos cambios de GitHub...' &&
               git pull origin main &&
               echo '→ Instalando dependencias...' &&
               npm ci &&
               echo '→ Generando cliente de Prisma...' &&
               npx prisma generate &&
               echo '→ Construyendo la aplicación...' &&
               npm run build &&
               echo '→ Reiniciando servidor con PM2...' &&
               pm2 restart cospace || pm2 start npm --name 'cospace' -- start &&
               echo '✅ Deploy completado con éxito.'"
